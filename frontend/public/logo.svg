<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background glow filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Wing linear gradients -->
    <linearGradient id="delta-grad" x1="50" y1="8" x2="50" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="45%" stop-color="#00A3FF"/>
      <stop offset="100%" stop-color="#0052FF"/>
    </linearGradient>

    <linearGradient id="wing-dark" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="core-glow" x1="50" y1="36" x2="50" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F7FF"/>
      <stop offset="50%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0077FE"/>
    </linearGradient>
  </defs>

  <!-- Outer Delta Stealth Body -->
  <path
    d="M 50 10 
       L 86 68 
       L 72 82 
       L 50 68 
       L 28 82 
       L 14 68 
       Z"
    fill="url(#wing-dark)"
    stroke="url(#delta-grad)"
    stroke-width="2.5"
    stroke-linejoin="round"
    filter="url(#neon-glow)"
  />

  <!-- Inner Wing Facets -->
  <path
    d="M 50 16 
       L 78 64 
       L 68 73 
       L 50 62 
       L 32 73 
       L 22 64 
       Z"
    fill="none"
    stroke="#00D2FF"
    stroke-width="1.2"
    stroke-opacity="0.45"
    stroke-dasharray="3 2"
  />

  <!-- Vertical Keel Spine -->
  <line x1="50" y1="12" x2="50" y2="40" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="60" x2="50" y2="68" stroke="#00D2FF" stroke-width="2" stroke-linecap="round"/>

  <!-- Left / Right Swept Neural Traces -->
  <path d="M 50 32 L 28 50 L 22 64" fill="none" stroke="#00D2FF" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 50 32 L 72 50 L 78 64" fill="none" stroke="#00D2FF" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 50 42 L 36 56 L 32 72" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 50 42 L 64 56 L 68 72" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Telemetry Circuit Nodes -->
  <circle cx="28" cy="50" r="2.2" fill="#E0F7FF" filter="url(#neon-glow)"/>
  <circle cx="72" cy="50" r="2.2" fill="#E0F7FF" filter="url(#neon-glow)"/>
  <circle cx="36" cy="56" r="1.8" fill="#00F0FF"/>
  <circle cx="64" cy="56" r="1.8" fill="#00F0FF"/>
  <circle cx="50" cy="20" r="2" fill="#E0F7FF"/>

  <!-- Cybernetic Hexagon Core -->
  <polygon
    points="50,42 58,46.5 58,55.5 50,60 42,55.5 42,46.5"
    fill="url(#core-glow)"
    stroke="#FFFFFF"
    stroke-width="1.5"
    filter="url(#neon-glow)"
  />

  <circle cx="50" cy="51" r="2.5" fill="#FFFFFF"/>
</svg>
