[project]
name = "taskpilot-ai"
version = "0.1.0"
description = "TaskPilot AI Personal Assistant Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.3",
    "python-dotenv>=1.0.1",
    "groq>=0.9.0",
    "httpx>=0.27.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.24.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

